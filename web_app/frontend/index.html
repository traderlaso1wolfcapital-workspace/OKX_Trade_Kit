<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <link rel="apple-touch-icon" href="/logo.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1e1e1e" />
    <title>AutoTrader</title>
    <script>
      function setRealAppHeight() {
        var h = window.innerHeight;
        document.documentElement.style.setProperty('--real-app-height', h + 'px');
      }
      setRealAppHeight();
      window.addEventListener('resize', setRealAppHeight);
      window.addEventListener('orientationchange', function() {
        setTimeout(setRealAppHeight, 100);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', setRealAppHeight);
      }
    </script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
